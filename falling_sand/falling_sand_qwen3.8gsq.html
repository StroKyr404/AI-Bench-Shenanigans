<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SANDFALL — falling sand sandbox</title>
<style>
  :root{
    --bg:#0d1117; --panel:#141a22; --line:#28323f; --line2:#3a4756;
    --text:#e7edf4; --muted:#8494a6; --amber:#ffc169; --accent:#e8b45f;
    --display: Impact, 'Haettenschweiler', 'Franklin Gothic Medium', 'Arial Black', sans-serif;
    --mono: ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  }
  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    margin:0; display:flex; flex-direction:column; overflow:hidden;
    color:var(--text); font-family:var(--mono);
    background:
      radial-gradient(900px 520px at 12% -10%, rgba(255,177,84,.07), transparent 60%),
      radial-gradient(1000px 620px at 96% 112%, rgba(74,164,224,.07), transparent 60%),
      var(--bg);
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image: radial-gradient(rgba(148,170,196,.05) 1px, transparent 1.5px);
    background-size: 22px 22px;
  }

  /* ───────────── top control bar ───────────── */
  .bar{
    position:relative; z-index:2;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:12px 18px 11px;
    background:linear-gradient(180deg,#18202a,#121820);
    border-bottom:1px solid var(--line);
    box-shadow:0 12px 32px -14px rgba(0,0,0,.65);
    user-select:none;
  }
  .brand{ display:flex; align-items:center; gap:11px; animation:rise .5s backwards; }
  .logo{ display:grid; grid-template-columns:repeat(3,8px); grid-auto-rows:8px; gap:2px; }
  .logo i{ width:8px; height:8px; background:var(--a); animation:pix 2.1s infinite; }
  @keyframes pix{ 0%,44%{ background:var(--a);} 50%,100%{ background:var(--b);} }
  .brand h1{
    margin:0; font-family:var(--display); font-weight:400;
    font-size:22px; letter-spacing:.09em; color:#f4f7fb;
    text-shadow:0 2px 0 rgba(0,0,0,.45);
  }
  .brand h1 em{ font-style:normal; color:var(--amber); }
  .sub{
    display:block; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin-top:3px;
  }

  .tools{ display:flex; gap:8px; flex-wrap:wrap; }
  .tool{
    display:flex; align-items:center; gap:8px;
    font:700 11px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase;
    color:#cfd8e2; background:#1b232e; border:1px solid var(--line);
    padding:9px 11px 9px 10px; cursor:pointer;
    transition:transform .12s ease, border-color .12s, background .12s, box-shadow .12s, color .12s;
    animation:rise .5s backwards;
  }
  .tool:nth-child(1){animation-delay:.02s} .tool:nth-child(2){animation-delay:.06s}
  .tool:nth-child(3){animation-delay:.10s} .tool:nth-child(4){animation-delay:.14s}
  .tool:nth-child(5){animation-delay:.18s}
  .tool:hover{ transform:translateY(-2px); border-color:var(--line2); color:#fff; }
  .tool:active{ transform:translateY(0); }
  .tool.on{
    color:#fff; border-color:var(--c);
    background:#222c38;
    background:color-mix(in srgb, var(--c) 16%, #1b232e);
    box-shadow:0 0 0 1px var(--c) inset, 0 8px 22px -8px var(--c);
  }
  .tool kbd{
    font:700 9px/1 var(--mono); color:var(--muted);
    border:1px solid var(--line); padding:2px 4px;
  }
  .tool.on kbd{ color:var(--c); }
  .px{
    width:14px; height:14px; flex:none;
    background:conic-gradient(var(--c) 0 25%, var(--c2) 0 50%, var(--c) 0 75%, var(--c2) 0 100%);
    box-shadow:0 0 0 1px rgba(0,0,0,.35);
    transition:transform .15s ease;
  }
  .tool:hover .px{ transform:scale(1.25); }

  .right{ display:flex; align-items:center; gap:10px; margin-left:auto; flex-wrap:wrap; }
  .brush{
    display:flex; align-items:center; gap:9px;
    font:700 10px var(--mono); letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); background:#161d26; border:1px solid var(--line);
    padding:9px 12px; animation:rise .5s .2s backwards;
  }
  .brush b{ color:var(--accent); font-size:12px; min-width:2ch; text-align:right; }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:110px; height:3px; outline:none; cursor:pointer;
    background:linear-gradient(90deg, var(--accent), #33404f); border-radius:2px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px;
    background:var(--accent); border:3px solid #10151c;
    box-shadow:0 0 0 1px var(--accent); transition:transform .1s;
  }
  input[type=range]::-webkit-slider-thumb:hover{ transform:scale(1.2); }
  input[type=range]::-moz-range-track{
    height:3px; background:linear-gradient(90deg, var(--accent), #33404f); border-radius:2px;
  }
  input[type=range]::-moz-range-thumb{
    width:13px; height:13px; background:var(--accent);
    border:3px solid #10151c; border-radius:0;
  }
  .sysbtn{
    font:700 11px var(--mono); letter-spacing:.1em; text-transform:uppercase;
    color:#cfd8e2; background:#1b232e; border:1px solid var(--line);
    padding:9px 12px; cursor:pointer;
    transition:transform .12s, border-color .12s, color .12s;
    animation:rise .5s .24s backwards;
  }
  .sysbtn:hover{ transform:translateY(-2px); border-color:var(--line2); color:#fff; }
  .sysbtn.warn:hover{ border-color:#c4563a; color:#ff9a76; }

  /* ───────────── stage ───────────── */
  .stage{
    flex:1; min-height:0; position:relative;
    display:flex; align-items:center; justify-content:center;
    padding:20px; user-select:none; z-index:1;
  }
  .frame{
    padding:6px;
    background:linear-gradient(180deg,#1a222d,#141a22);
    border:1px solid #2b3644;
    box-shadow:0 44px 90px -30px rgba(0,0,0,.85);
    animation:cvfade .7s .1s backwards;
  }
  #cv{
    display:block;
    image-rendering:crisp-edges; image-rendering:pixelated;
    background:#10141b; border:1px solid #262f3b;
    cursor:none; touch-action:none;
    transition:filter .3s;
  }
  .stage.paused #cv{ filter:brightness(.6) saturate(.75); }

  .hud{
    position:absolute; left:18px; bottom:16px;
    display:flex; align-items:center; gap:12px;
    font:700 10.5px var(--mono); letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted);
    background:rgba(9,12,16,.82); border:1px solid #2b3542;
    padding:8px 12px; box-shadow:0 10px 26px -12px #000;
    animation:rise .5s .3s backwards;
  }
  .hud b{ color:var(--amber); font-size:13px; font-variant-numeric:tabular-nums; }
  .hud-sep{ width:1px; height:14px; background:#2b3542; }
  .dot{ width:7px; height:7px; background:#59d98a; animation:pulse 1.6s infinite; }
  #pausedChip{ color:var(--amber); }
  @keyframes pulse{ 0%,100%{ opacity:1; box-shadow:0 0 7px #59d98a; } 50%{ opacity:.3; box-shadow:none; } }

  .hint{
    position:absolute; right:18px; bottom:18px;
    font:11px var(--mono); letter-spacing:.05em; color:#5f6d7e;
    animation:rise .5s .34s backwards;
  }

  @keyframes rise{ from{ opacity:0; transform:translateY(8px); } }
  @keyframes cvfade{ from{ opacity:0; transform:scale(.985); } }

  @media (max-width:900px){
    .hint, .sub{ display:none; }
    .bar{ gap:10px; padding:10px 12px; }
    .tool{ padding:8px 9px; }
    .stage{ padding:12px; }
  }
</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <i style="--a:#e8b45f;--b:#6b4f22"></i>
      <i style="--a:#54b9ec;--b:#1f4e73;animation-delay:.4s"></i>
      <i style="--a:#ff8046;--b:#7a2a10;animation-delay:.9s"></i>
      <i style="--a:#bd8a45;--b:#5a3c1c;animation-delay:1.3s"></i>
      <i style="--a:#39424e;--b:#232a33;animation-delay:.2s"></i>
    </span>
    <div>
      <h1>SAND<em>FALL</em></h1>
      <span class="sub">cellular automaton · 240 × 200 grid</span>
    </div>
  </div>

  <nav class="tools" aria-label="materials">
    <button class="tool on" data-m="1" style="--c:#e8b45f;--c2:#c9973f"><span class="px"></span>Sand<kbd>1</kbd></button>
    <button class="tool" data-m="2" style="--c:#54b9ec;--c2:#2f86c4"><span class="px"></span>Water<kbd>2</kbd></button>
    <button class="tool" data-m="3" style="--c:#bd8a45;--c2:#8a5f2c"><span class="px"></span>Wood<kbd>3</kbd></button>
    <button class="tool" data-m="4" style="--c:#ff8046;--c2:#d14424"><span class="px"></span>Fire<kbd>4</kbd></button>
    <button class="tool" data-m="0" style="--c:#9aa6b2;--c2:#5d6772"><span class="px"></span>Erase<kbd>0</kbd></button>
  </nav>

  <div class="right">
    <label class="brush">brush
      <input id="brush" type="range" min="1" max="24" value="6" aria-label="brush size">
      <b id="brushVal">6</b>
    </label>
    <button id="pauseBtn" class="sysbtn">❚❚ pause</button>
    <button id="clearBtn" class="sysbtn warn">clear</button>
  </div>
</header>

<main class="stage" id="stage">
  <div class="frame">
    <canvas id="cv"></canvas>
  </div>
  <div class="hud">
    <span class="dot" aria-hidden="true"></span>
    <span>particles <b id="pc">0</b></span>
    <span class="hud-sep" aria-hidden="true"></span>
    <span>fps <b id="fps">60</b></span>
    <span class="hud-sep" aria-hidden="true"></span>
    <span id="pausedChip" hidden>paused</span>
  </div>
  <div class="hint">drag paint · right-drag erase · 1–4 tools · [ ] brush · space pause · C clear</div>
</main>

<script>
(() => {
'use strict';

/* ───────── grid & state ───────── */
const W = 240, H = 200, N = W * H;           // ≥ 200×200, nearest-neighbour upscaled
const EMPTY = 0, SAND = 1, WATER = 2, WOOD = 3, FIRE = 4;

const grid    = new Uint8Array(N);           // material id per cell
const life    = new Uint8Array(N);           // fire lifetime (frames remaining)
const variant = new Uint8Array(N);           // per-cell colour variation (pixel-art dither)
const moved   = new Uint8Array(N);           // "moved this frame" guard — prevents tearing
let   count   = 0;                           // live particle tally (incrementally maintained)
let   frameNo = 0;

/* ───────── palettes (precomputed) ───────── */
const SAND_P  = [[222,182,104],[206,164,88],[234,196,126],[190,150,78]];
const WATER_P = [[ 52,132,205],[ 40,116,186],[ 66,148,220],[ 36,106,172]];
const WOOD_P  = [[128, 88, 48],[114, 76, 40],[140, 98, 56],[102, 66, 34]];
const FIRE_P  = [];
for (let k = 0; k < 16; k++){
  const t = k / 15;
  FIRE_P.push([
    Math.round(110 + 145 * t),
    Math.round( 38 + 198 * t),
    Math.round( 16 + 134 * t)
  ]);
}

/* ───────── canvases ───────── */
const mcv  = document.getElementById('cv');
const ctx  = mcv.getContext('2d');
const ocv  = document.createElement('canvas');   // 1px-per-cell buffer
const octx = ocv.getContext('2d');
ocv.width = W; ocv.height = H;
const img  = octx.createImageData(W, H);

let scale = 1, dpr = 1;
const stage = document.getElementById('stage');

function resize(){
  dpr = window.devicePixelRatio || 1;
  const aw = stage.clientWidth  - 60;
  const ah = stage.clientHeight - 60;
  scale = Math.max(1, Math.min(8, Math.floor(Math.min(aw / W, ah / H))));
  mcv.style.width  = (W * scale) + 'px';
  mcv.style.height = (H * scale) + 'px';
  mcv.width  = Math.round(W * scale * dpr);
  mcv.height = Math.round(H * scale * dpr);
  ctx.imageSmoothingEnabled = false;            // crisp pixels
}
window.addEventListener('resize', resize);

/* ───────── physics step ─────────
   Scans rows BOTTOM → TOP so falling cells land in already-processed rows;
   a `moved` flag stops freshly-moved cells from travelling twice in one
   frame (the classic tearing fix). Scan direction alternates per row/frame
   to remove horizontal drift bias. All index math is bounds-guarded. */
function step(){
  frameNo++;
  moved.fill(0);

  for (let y = H - 1; y >= 0; y--){
    const ltr = (((y ^ frameNo) & 1) === 0);
    for (let xi = 0; xi < W; xi++){
      const x = ltr ? xi : (W - 1 - xi);
      const i = y * W + x;
      const m = grid[i];
      if (m === EMPTY || m === WOOD || moved[i]) continue;   // wood is static

      /* ── SAND: falls, sinks through water, slides diagonally ── */
      if (m === SAND){
        if (y < H - 1){
          const b  = i + W;
          const bm = grid[b];
          if (bm === EMPTY){
            grid[i] = EMPTY; grid[b] = SAND; moved[b] = 1;
          } else if (bm === WATER){
            grid[i] = WATER; grid[b] = SAND; moved[b] = 1; moved[i] = 1;
          } else {
            const dl = x > 0   ? b - 1 : -1;
            const dr = x < W-1 ? b + 1 : -1;
            let t = -1;
            if (dl < 0)       t = (dr >= 0 && grid[dr] === EMPTY) ? dr : -1;
            else if (dr < 0)  t = (grid[dl] === EMPTY) ? dl : -1;
            else{
              const eL = grid[dl] === EMPTY, eR = grid[dr] === EMPTY;
              if (eL && eR) t = (Math.random() < 0.5) ? dl : dr;
              else if (eL)  t = dl;
              else if (eR)  t = dr;
            }
            if (t >= 0){ grid[i] = EMPTY; grid[t] = SAND; moved[t] = 1; }
          }
        }
      }
      /* ── WATER: falls, pours, spreads sideways, douses fire ── */
      else if (m === WATER){
        let n;
        if (y > 0)   { n = i - W;   if (grid[n] === FIRE && Math.random() < 0.85){ grid[n] = EMPTY; life[n] = 0; count--; } }
        if (y < H-1) { n = i + W;   if (grid[n] === FIRE && Math.random() < 0.85){ grid[n] = EMPTY; life[n] = 0; count--; } }
        if (x > 0)   { n = i - 1;   if (grid[n] === FIRE && Math.random() < 0.85){ grid[n] = EMPTY; life[n] = 0; count--; } }
        if (x < W-1) { n = i + 1;   if (grid[n] === FIRE && Math.random() < 0.85){ grid[n] = EMPTY; life[n] = 0; count--; } }

        let t = -1, kill = false;
        if (y < H - 1){
          const b  = i + W;
          const bm = grid[b];
          if (bm === EMPTY)       t = b;
          else if (bm === FIRE)   { t = b; kill = true; }
          else{
            const dl = x > 0   ? b - 1 : -1;
            const dr = x < W-1 ? b + 1 : -1;
            if (Math.random() < 0.5){
              if (dl >= 0 && grid[dl] === EMPTY) t = dl;
              else if (dr >= 0 && grid[dr] === EMPTY) t = dr;
            } else {
              if (dr >= 0 && grid[dr] === EMPTY) t = dr;
              else if (dl >= 0 && grid[dl] === EMPTY) t = dl;
            }
          }
        }
        if (t < 0){
          const l = x > 0   ? i - 1 : -1;
          const r = x < W-1 ? i + 1 : -1;
          if (Math.random() < 0.5){
            if (l >= 0 && grid[l] === EMPTY) t = l;
            else if (r >= 0 && grid[r] === EMPTY) t = r;
          } else {
            if (r >= 0 && grid[r] === EMPTY) t = r;
            else if (l >= 0 && grid[l] === EMPTY) t = l;
          }
        }
        if (t >= 0){
          if (kill){ count--; life[t] = 0; }   // displaced fire is extinguished
          grid[i] = EMPTY; grid[t] = WATER; moved[t] = 1;
        }
      }
      /* ── FIRE: flickers upward, consumes wood, drowns in water, dies ── */
      else {
        let lf = life[i] - 1;
        let wet = false;
        const x0 = x > 0   ? x - 1 : 0, x1 = x < W-1 ? x + 1 : x;
        const y0 = y > 0   ? y - 1 : 0, y1 = y < H-1 ? y + 1 : y;
        for (let ny = y0; ny <= y1; ny++){
          let ni = ny * W + x0;
          for (let nx = x0; nx <= x1; nx++, ni++){
            if (nx === x && ny === y) continue;
            const nm = grid[ni];
            if (nm === WATER) wet = true;
            else if (nm === WOOD && Math.random() < 0.06){
              // ignite the wood: it becomes burning fuel that burns out to empty
              grid[ni] = FIRE; life[ni] = 10 + (Math.random() * 14 | 0);
              variant[ni] = (Math.random() * 4) | 0;
            }
          }
        }
        if (wet) lf -= 6;
        if (lf <= 0){ grid[i] = EMPTY; life[i] = 0; count--; continue; }

        if (y > 0 && Math.random() < 0.5){
          const u = i - W;
          let t = -1;
          if (Math.random() < 0.5){
            if (x > 0   && grid[u - 1] === EMPTY) t = u - 1;
            else if (grid[u] === EMPTY)           t = u;
            else if (x < W-1 && grid[u + 1] === EMPTY) t = u + 1;
          } else {
            if (x < W-1 && grid[u + 1] === EMPTY) t = u + 1;
            else if (grid[u] === EMPTY)           t = u;
            else if (x > 0   && grid[u - 1] === EMPTY) t = u - 1;
          }
          if (t >= 0){ grid[i] = EMPTY; grid[t] = FIRE; life[t] = lf; moved[t] = 1; continue; }
        }
        life[i] = lf;
      }
    }
  }
}

/* ───────── rendering (1px/cell → nearest-neighbour upscale) ───────── */
function render(){
  const d = img.data;
  for (let y = 0; y < H; y++){
    for (let x = 0; x < W; x++){
      const i = y * W + x;
      const m = grid[i];
      let r, g, b;
      if (m === SAND){
        const p = SAND_P[variant[i]]; r = p[0]; g = p[1]; b = p[2];
      } else if (m === WATER){
        if (Math.random() < 0.05) variant[i] = (Math.random() * 4) | 0;   // gentle shimmer
        const p = WATER_P[variant[i]]; r = p[0]; g = p[1]; b = p[2];
      } else if (m === WOOD){
        const p = WOOD_P[variant[i]]; r = p[0]; g = p[1]; b = p[2];
      } else if (m === FIRE){
        let t = (life[i] * 15 / 52) | 0;
        t += ((Math.random() * 3) | 0) - 1;                               // flicker
        if (t < 0) t = 0; else if (t > 15) t = 15;
        const p = FIRE_P[t]; r = p[0]; g = p[1]; b = p[2];
      } else {
        const c = (x & 1) ^ (y & 1);                                     // subtle bg dither
        r = c ? 19 : 23; g = c ? 23 : 28; b = c ? 31 : 37;
      }
      const q = i << 2;
      d[q] = r; d[q+1] = g; d[q+2] = b; d[q+3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
  ctx.drawImage(ocv, 0, 0, mcv.width, mcv.height);
}

/* ───────── brush / input ───────── */
const TOOLS = {
  0: { color: '#9aa6b2' }, 1: { color: '#e8b45f' },
  2: { color: '#54b9ec' }, 3: { color: '#bd8a45' }, 4: { color: '#ff8046' }
};
let curMat = SAND, curColor = TOOLS[SAND].color, brush = 6;
let pointerDown = false, rightBtn = false, inside = false;
let cssX = 0, cssY = 0, cellX = 0, cellY = 0, lastX = 0, lastY = 0;

function paintCell(cx, cy, mat){
  if (cx === undefined || !Number.isInteger(cx) || !Number.isInteger(cy)) return;
  const r = brush;
  if (cx + r < 0 || cx - r >= W || cy + r < 0 || cy - r >= H) return;   // off-canvas early-out
  for (let dy = -r; dy <= r; dy++){
    const y = cy + dy;
    const dy2 = dy * dy;
    for (let dx = -r; dx <= r; dx++){
      if (dx * dx + dy2 > r * r) continue;
      const x = cx + dx;
      if (x < 0 || x >= W || y < 0 || y >= H) continue;
      const i = y * W + x;
      if (mat === EMPTY){
        if (grid[i] !== EMPTY){ grid[i] = EMPTY; life[i] = 0; count--; }
      } else if (grid[i] !== mat){
        if (grid[i] === EMPTY) count++;
        grid[i] = mat;
        variant[i] = (Math.random() * 4) | 0;
        if (mat === FIRE) life[i] = 26 + (Math.random() * 26 | 0);
        else life[i] = 0;
      }
    }
  }
}

function toCell(e){
  const rect = mcv.getBoundingClientRect();
  cssX = e.clientX - rect.left;
  cssY = e.clientY - rect.top;
  cellX = Math.floor(cssX / scale);
  cellY = Math.floor(cssY / scale);
}

mcv.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { mcv.setPointerCapture(e.pointerId); } catch (_) {}
  pointerDown = true;
  rightBtn = (e.button === 2);
  toCell(e); inside = true;
  lastX = cellX; lastY = cellY;
  paintCell(cellX, cellY, rightBtn ? EMPTY : curMat);
});
mcv.addEventListener('pointermove', e => {
  toCell(e); inside = true;
  if (pointerDown){
    const mat = rightBtn ? EMPTY : curMat;
    const dx = cellX - lastX, dy = cellY - lastY;
    const steps = Math.max(Math.abs(dx), Math.abs(dy));
    if (steps === 0){
      paintCell(cellX, cellY, mat);
    } else {
      for (let s = 0; s <= steps; s++)
        paintCell(Math.round(lastX + dx * s / steps), Math.round(lastY + dy * s / steps), mat);
    }
  }
  lastX = cellX; lastY = cellY;
});
['pointerup','pointercancel'].forEach(ev =>
  mcv.addEventListener(ev, () => { pointerDown = false; rightBtn = false; }));
mcv.addEventListener('pointerleave', () => { if (!pointerDown) inside = false; });
mcv.addEventListener('contextmenu', e => e.preventDefault());

function drawRing(){
  const px = cssX * dpr, py = cssY * dpr;
  const rr = Math.max(brush * scale * dpr, 2);
  ctx.save();
  ctx.beginPath(); ctx.arc(px, py, rr, 0, Math.PI * 2);
  ctx.globalAlpha = 0.14; ctx.fillStyle = curColor; ctx.fill();
  ctx.globalAlpha = 0.95; ctx.strokeStyle = curColor;
  ctx.lineWidth = Math.max(1, Math.min(2.5, scale * 0.6));
  ctx.stroke();
  ctx.restore();
}

/* ───────── UI wiring ───────── */
const pcEl     = document.getElementById('pc');
const fpsEl    = document.getElementById('fps');
const brushEl  = document.getElementById('brush');
const brushVal = document.getElementById('brushVal');
const pauseBtn = document.getElementById('pauseBtn');
const clearBtn = document.getElementById('clearBtn');
const chip     = document.getElementById('pausedChip');
const btns     = [...document.querySelectorAll('.tool')];

function setTool(m){
  curMat = m;
  curColor = TOOLS[m].color;
  document.documentElement.style.setProperty('--accent', curColor);
  btns.forEach(b => b.classList.toggle('on', +b.dataset.m === m));
}
btns.forEach(b => b.addEventListener('click', e => {
  setTool(+e.currentTarget.dataset.m);
  e.currentTarget.blur();
}));

function setBrush(v){
  v = Math.max(1, Math.min(24, Math.round(v)));
  brush = v; brushEl.value = v; brushVal.textContent = v;
}
brushEl.addEventListener('input', () => setBrush(+brushEl.value));

let paused = false;
function togglePause(){
  paused = !paused;
  stage.classList.toggle('paused', paused);
  pauseBtn.textContent = paused ? '▶ run' : '❚❚ pause';
  chip.hidden = !paused;
}
pauseBtn.addEventListener('click', e => { togglePause(); e.currentTarget.blur(); });

function clearAll(){ grid.fill(0); life.fill(0); moved.fill(0); count = 0; }
clearBtn.addEventListener('click', e => { clearAll(); e.currentTarget.blur(); });

window.addEventListener('keydown', e => {
  switch (e.key){
    case '1': setTool(SAND);  break;
    case '2': setTool(WATER); break;
    case '3': setTool(WOOD);  break;
    case '4': setTool(FIRE);  break;
    case '0': case 'e': case 'E': setTool(EMPTY); break;
    case '[': setBrush(brush - 1); break;
    case ']': setBrush(brush + 1); break;
    case 'c': case 'C': clearAll(); break;
    case ' ': e.preventDefault(); togglePause(); break;
  }
});

/* ───────── opening scene: bridge, sand, water, burning timber ───────── */
function seed(){
  grid.fill(0); life.fill(0); moved.fill(0); count = 0;
  const put = (x, y, m) => {
    if (x < 0 || x >= W || y < 0 || y >= H) return;
    const i = y * W + x;
    if (grid[i] === m) return;
    if (grid[i] === EMPTY) count++;
    grid[i] = m;
    variant[i] = (Math.random() * 4) | 0;
    if (m === FIRE) life[i] = 30 + (Math.random() * 22 | 0);
  };
  for (let x = 58; x <= 186; x++){ put(x, 146, WOOD); put(x, 147, WOOD); }         // plank bridge
  for (let k = 0; k < 2400; k++) put(70 + (Math.random()*60|0), 34 + (Math.random()*66|0), SAND); // sand load
  for (let x = 198; x <= 228; x++) for (let y = 46; y <= 60; y++) put(x, y, WATER);                 // water sheet
  for (let y = 124; y <= 145; y++) for (let x = 18; x <= 27; x++) put(x, y, WOOD);                // timber stack
  for (let y = 112; y <= 123; y++) for (let x = 16; x <= 29; x++) if (Math.random() < 0.75) put(x, y, FIRE);
  for (let k = 0; k < 800; k++) put((Math.random()*96|0), H - 46 + (Math.random()*44|0), SAND);     // sand mound
}

/* ───────── main loop ───────── */
let lastT = performance.now(), fps = 60;
function loop(t){
  requestAnimationFrame(loop);
  const dt = t - lastT; lastT = t;
  if (dt > 0 && dt < 1000) fps = fps * 0.92 + (1000 / dt) * 0.08;

  if (pointerDown && inside) paintCell(cellX, cellY, rightBtn ? EMPTY : curMat);
  if (!paused) step();

  render();
  if (inside) drawRing();

  pcEl.textContent  = count.toLocaleString('en-US');
  fpsEl.textContent = Math.round(fps);
}

seed();
resize();
setTool(SAND);
requestAnimationFrame(loop);
})();
</script>
