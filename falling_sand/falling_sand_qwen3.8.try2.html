<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Falling Sand</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:monospace}
#ui{height:54px;background:#1c1c1c;border-bottom:2px solid #333;display:flex;align-items:center;gap:8px;padding:0 10px;user-select:none;flex-wrap:wrap}
.btn{font-family:monospace;font-size:13px;padding:5px 11px;cursor:pointer;background:#2a2a2a;color:#ccc;border:2px solid #444;border-radius:3px}
.btn:hover{background:#383838}
.btn.active{border-color:#fff;background:#444;color:#fff}
.btn.sand.active{border-color:#e0c060;color:#e0c060}
.btn.water.active{border-color:#4a8cff;color:#4a8cff}
.btn.wood.active{border-color:#b0793c;color:#b0793c}
.btn.fire.active{border-color:#ff7722;color:#ff7722}
#brushwrap{display:flex;align-items:center;gap:6px;color:#aaa;font-size:12px;margin-left:6px}
#brush{width:100px}
#stats{margin-left:auto;color:#9f9;font-size:12px;letter-spacing:1px}
#stats b{color:#fff}
#stage{display:block;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<div id="ui">
<button class="btn sand active" data-m="1">Sand</button>
<button class="btn water" data-m="2">Water</button>
<button class="btn wood" data-m="3">Wood</button>
<button class="btn fire" data-m="4">Fire</button>
<button class="btn" id="clear">Clear</button>
<div id="brushwrap">
Brush <input type="range" id="brush" min="0" max="15" value="3"><span id="brushval">4</span>
</div>
<div id="stats">particles: <b id="pc">0</b> &nbsp;|&nbsp; fps: <b id="fps">0</b></div>
</div>
<canvas id="stage"></canvas>
<script>
(function(){
"use strict";

const W=200, H=200, N=W*H;
const EMPTY=0, SAND=1, WATER=2, WOOD=3, FIRE=4;

const state=new Uint8Array(N);
const life=new Uint8Array(N);  // fire lifetime / wood burn progress
const moved=new Uint8Array(N);
const shade=new Uint8Array(N);
for(let i=0;i<N;i++) shade[i]=(Math.random()*40)|0;

const stage=document.getElementById('stage');
const sctx=stage.getContext('2d');
const off=document.createElement('canvas');
off.width=W; off.height=H;
const octx=off.getContext('2d');
const img=octx.createImageData(W,H);
const px=img.data;
px.fill(255);

function resize(){
  const uiH=54;
  const cell=Math.max(1,Math.floor(Math.min(window.innerWidth/W,(window.innerHeight-uiH)/H)));
  stage.width=W*cell;
  stage.height=H*cell;
  sctx.imageSmoothingEnabled=false;
}
window.addEventListener('resize',resize);
resize();

// --- UI ---
let cur=SAND, brush=3;
const btns=document.querySelectorAll('.btn[data-m]');
btns.forEach(b=>b.addEventListener('click',()=>{
  cur=+b.dataset.m;
  btns.forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
}));
document.getElementById('clear').addEventListener('click',()=>{state.fill(0);life.fill(0);});
const brushEl=document.getElementById('brush');
const brushVal=document.getElementById('brushval');
brushEl.addEventListener('input',()=>{brush=+brushEl.value;brushVal.textContent=brush+1;});

const pcEl=document.getElementById('pc');
const fpsEl=document.getElementById('fps');

// --- Painting ---
let painting=false;
function gridPos(cx,cy){
  const r=stage.getBoundingClientRect();
  return [
    Math.floor((cx-r.left)/r.width*W),
    Math.floor((cy-r.top)/r.height*H)
  ];
}
function paint(gx,gy){
  const r=brush, r2=r*r;
  for(let dy=-r;dy<=r;dy++){
    for(let dx=-r;dx<=r;dx++){
      if(dx*dx+dy*dy>r2) continue;
      const x=gx+dx, y=gy+dy;
      if(x<0||y<0||x>=W||y>=H) continue;
      const i=y*W+x;
      state[i]=cur;
      life[i]=(cur===FIRE)?(40+(Math.random()*40|0)):0;
    }
  }
}
stage.addEventListener('mousedown',e=>{painting=true;const[x,y]=gridPos(e.clientX,e.clientY);paint(x,y);});
window.addEventListener('mouseup',()=>painting=false);
stage.addEventListener('mousemove',e=>{if(painting){const[x,y]=gridPos(e.clientX,e.clientY);paint(x,y);}});
stage.addEventListener('touchstart',e=>{e.preventDefault();painting=true;const t=e.touches[0];const[x,y]=gridPos(t.clientX,t.clientY);paint(x,y);},{passive:false});
stage.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];const[x,y]=gridPos(t.clientX,t.clientY);paint(x,y);},{passive:false});
stage.addEventListener('touchend',()=>painting=false);

// --- Physics helpers ---
function inB(x,y){return x>=0&&x<W&&y>=0&&y<H;}

function updateSand(x,y,i){
  const below=y+1<W;
  // Fall straight down
  if(below){
    const b=i+W;
    const m=state[b];
    if(m===EMPTY||m===WATER){
      state[i]=m; life[i]=0;
      state[b]=SAND; life[b]=0;
      moved[b]=1;
      if(m===WATER) moved[i]=1;
      return;
    }
  }
  // Slide diagonally
  const dir=Math.random()<0.5?-1:1;
  for(let s=0;s<2;s++){
    const dx=s===0?dir:-dir;
    const nx=x+dx;
    if(!below||!inB(nx,y+1)) continue;
    const bi=(y+1)*W+nx;
    const si=y*W+nx;
    if(state[si]===EMPTY&&(state[bi]===EMPTY||state[bi]===WATER)){
      state[i]=state[bi]; life[i]=0;
      state[bi]=SAND; life[bi]=0;
      moved[bi]=1;
      if(state[i]===WATER) moved[i]=1;
      return;
    }
  }
}

function updateWater(x,y,i){
  const below=y+1<H;
  // Fall down
  if(below){
    const b=i+W;
    if(state[b]===EMPTY){
      state[i]=EMPTY; state[b]=WATER;
      moved[b]=1;
      return;
    }
  }
  // Spread horizontally
  const dir=Math.random()<0.5?-1:1;
  for(let s=0;s<2;s++){
    const dx=s===0?dir:-dir;
    const nx=x+dx;
    if(!inB(nx,y)) continue;
    const ni=y*W+nx;
    if(state[ni]===EMPTY){
      state[i]=EMPTY; state[ni]=WATER;
      moved[ni]=1;
      return;
    }
  }
  // Slide diagonally down
  if(below){
    for(let s=0;s<2;s++){
      const dx=s===0?dir:-dir;
      const nx=x+dx;
      if(!inB(nx,y+1)) continue;
      const bi=(y+1)*W+nx;
      if(state[bi]===EMPTY){
        state[i]=EMPTY; state[bi]=WATER;
        moved[bi]=1;
        return;
      }
    }
  }
}

function updateFire(x,y,i){
  // Check for adjacent water → instant extinction
  for(let dy=-1;dy<=1;dy++){
    for(let dx=-1;dx<=1;dx++){
      const nx=x+dx, ny=y+dy;
      if(inB(nx,ny)&&state[ny*W+nx]===WATER){
        state[i]=EMPTY; life[i]=0;
        return;
      }
    }
  }
  // Burn adjacent wood
  for(let dy=-1;dy<=1;dy++){
    for(let dx=-1;dx<=1;dx++){
      const nx=x+dx, ny=y+dy;
      if(!inB(nx,ny)) continue;
      const ni=ny*W+nx;
      if(state[ni]===WOOD){
        life[ni]=Math.min(255,life[ni]+40);
        if(life[ni]>=255){
          state[ni]=EMPTY; life[ni]=0;
        }
      }
    }
  }
  // Rise upward (flicker)
  if(y>0&&Math.random()<0.2){
    const a=i-W;
    if(state[a]===EMPTY){
      state[i]=EMPTY; state[a]=FIRE;
      life[a]=life[i]; life[i]=0;
      moved[a]=1;
      return;
    }
  }
  // Lifetime decay
  life[i]--;
  if(life[i]<=0){
    state[i]=EMPTY; life[i]=0;
  }
}

// --- Main step ---
let frame=0;
function step(){
  moved.fill(0);
  const ltr=(frame&1)===0;
  for(let y=H-1;y>=0;y--){
    for(let k=0;k<W;k++){
      const x=ltr?k:W-1-k;
      const i=y*W+x;
      if(moved[i]) continue;
      const m=state[i];
      if(m===SAND) updateSand(x,y,i);
      else if(m===WATER) updateWater(x,y,i);
      else if(m===FIRE) updateFire(x,y,i);
    }
  }
  frame++;
}

// --- Render ---
function render(){
  for(let i=0;i<N;i++){
    const m=state[i];
    const p=i*4;
    const v=shade[i];
    if(m===EMPTY){
      px[p]=15; px[p+1]=15; px[p+2]=20;
    }else if(m===SAND){
      px[p]=225-v; px[p+1]=192-v; px[p+2]=95;
    }else if(m===WATER){
      px[p]=30+(v>>1); px[p+1]=85; px[p+2]=210;
    }else if(m===WOOD){
      if(life[i]>0&&life[i]<200){
        px[p]=160+v; px[p+1]=80; px[p+2]=30;
      }else{
        px[p]=130+(v>>1); px[p+1]=82; px[p+2]=38;
      }
    }else if(m===FIRE){
      const f=((frame+v*3)&63);
      px[p]=255; px[p+1]=100+(f<<1); px[p+2]=10+(v>>1);
    }
  }
  octx.putImageData(img,0,0);
  sctx.drawImage(off,0,0,stage.width,stage.height);

  let c=0;
  for(let i=0;i<N;i++) if(state[i]) c++;
  pcEl.textContent=c;
}

// --- Loop ---
let frames=0, lastT=performance.now();
function loop(){
  step();
  render();
  frames++;
  const now=performance.now();
  if(now-lastT>=500){
    fpsEl.textContent=Math.round(frames*1000/(now-lastT));
    frames=0; lastT=now;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
